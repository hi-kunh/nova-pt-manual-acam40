<script type="text/plain" id="md"># IntelliScan Platinum — **ACAM40 보충 매뉴얼**

> **대상** ACAM40 ACU 를 쓰는 운영자
> **함께 보는 문서** `IntelliScan Platinum Administrator's Manual` (이하 **원본 매뉴얼**)
> **문서 버전** `0.4` · **상태** 🚧 **작성 중 — 배포 전입니다**

> **🛑 경고**
> **아직 배포하지 마세요.** 제목 옆에 `⬜` 가 붙은 자리는 **아직 확인하지 못한 것**입니다.

---

## 1. 이 문서를 읽는 법

Platinum 은 **IDTi ACU** 를 기준으로 만들어졌습니다. **ACAM40은 IDTi와 다른 회사 제품** 으로
구조적 차이가 있습니다. 그래서 같은 기능이라도 **동작 방법이 다릅니다.**

이 문서는 **그 차이만** 담습니다. 나머지는 원본 매뉴얼에 준해서 작성 했습니다.

```
원본 매뉴얼   Platinum 전체 사용법         ← 먼저 봅니다
이 문서      ACAM40 에서 달라지는 것만      ← 옆에 두고 봅니다
```

### 동작 방법으로 찾기

| 하려는 일 | 문서 위치 |
|---|---|
| 문이 안 열린다 · 이벤트가 이상하다 | **2.4 문제가 생겼을 때** |
| ACU 를 새로 설치 · 교체했다 | **4.1 ACU 설정하기** |
| 사용자에게 권한을 주고 싶다 · 삭제 하고 싶다 | **4.9 사용자 신규 및 변경 설정** |
| 문 여는 시간을 바꾸고 싶다 | **4.6 시간대 내용 보내기** |
| 공휴일을 추가 하고 싶다 | **4.7 공휴일 보내기** |
| 문을 지금 열고 싶다 · 닫고 싶다 | **4.10 문 열고 닫기** |
| 이 기능이 ACAM40 에서 되나 | **3.2** · **부록 A** |
| 이벤트에 내용이 무슨 뜻인가 | **6장 이벤트 읽기** |

### 표기

| 표시 | 뜻 |
|---|---|
| 🟢 | ACAM40 에서 **됩니다** |
| 🟡 | **일부만** 됩니다 |
| 🔴 | ACAM40 에서 **안 됩니다** — 화면에 칸이 있어도 눌러도 아무 일이 없습니다 |
| ➖ | **해당 사항이 없습니다** |

안내 상자는 넷입니다. **경고는 아껴 씁니다** — 이 문서 전체에 세 개뿐입니다.

> **알아두기** — 알고 있으면 이해가 빨라지는 것입니다.

> **💡 팁** — 몰라도 되지만 알면 편한 것입니다.

> **⚠ 주의** — 모르면 **헛수고를 하거나 설정이 어긋나는** 자리입니다.

> **🛑 경고** — 모르면 **문이 열린 채로 남거나, 막았다고 믿은 사람이 드나듭니다.**

### 🚧 근거 표시 — 작성 중이라 붙여 둡니다

이 문서가 완성되면 아래 표시는 지웁니다. 지금은 **어디까지 확인된 이야기인지** 구분해 둡니다.

| 표시 | 뜻 |
|---|---|
| ✅ | **실장비로 확인했습니다** |
| 📄 | **프로그램 소스 · 장비 규격 · SS2006 매뉴얼로 확인했습니다** — 실장비 확인은 아직입니다 |
| ⬜ | **아직 확인하지 못했습니다.** 그대로 믿지 마세요 |

### 🔤 **ACU** — 이 문서가 쓰는 말

| 이 문서의 말 | 무엇 |
|---|---|
| **ACU**(Access Control Unit) | 기종을 안 가리는 일반 지칭 |
| **ACAM40 ACU** | ACAM40 컨트롤러 |
| **IDTi ACU** | IDTi 컨트롤러 |

용어는 **Platinum 화면 말**을 쓰고, ACU 안에서 부르는 이름이 다르면 괄호로 붙입니다 —
`엑세스 그룹(도어그룹)` · `시간대(타임코드)`. 전체 대조는 **3.4**.

> **알아두기** — 메뉴 이름(`컨트롤러 관리` · `컨트롤러 동기화` · `컨트롤러 등록`)은
> **화면 글자 그대로** 두었습니다. 화면에서 `컨트롤러` 를 찾으셔야 합니다.

---

## 2. 시작하기

### 2.1 ACAM40 은 무엇이 다른가

| | **ACAM40** | **IDTi(SSC-324)** | 문서 위치 |
|---|---|---|---|
| 운영모드 · 스케줄 | 🔴 기능 없음 | 🟢 | 5장 §3.2 |
| 권한 레벨(등급) | 🔴 기능 없음 | 🟢 | 3.2 |
| 인터록 · 투맨 · 출입구역 | 🔴 기능 없음 | 🟢 | 3.2 |
| **안티패스백(APB)** | 🟡 **ACU에 기능은 있음. Platinum에서 UI 미지원** | 🟢 **Platinum 매뉴얼에 내용 없음**| **3.3** |
| 출입문 카메라(이미지 요청) | 🔴 없음 — 원본 §1.5 v 의 카메라 창은 늘 비어 있습니다 | 🟢 | — |
| 썸머타임 | 🔴 | 🟢 | 부록 A |
| **그룹 정의를 보내는 명령** | 🔴 없음 — `설정 다운로드` 가 한 번에 풉니다 | 그룹별로 따로 있음 | 4.1 |
| **공휴일** | ⚠ **연도가 박힙니다** — 해마다 다시 보냅니다 | 매년 반복 | 4.7 |
| 공휴일 받기(조회) | 🔴 | 🟢 | 부록 A |
| 인증 유효기간(번호) | 🔴 — 사용자의 **발급일 · 만료일**이 카드에 실려 나갑니다 | 🟢 | 4.8 |
| **강제개방 중 열림 · 닫힘** | 🔴 **ACU 가 거부합니다** | 🟢 동작 | **4.10** |
| **이벤트 종류** | **16가지** | 55가지 | 6장 |
| `통신 › 연결 끊김` 이벤트 | 🔴 안 올라옴 | 🟢 | 6장 |

🟢 **같은 것** — 카드 포맷 · 시간대 AND 판정 · 사용자그룹 8칸 · 엑세스 그룹 적용 방식 ·
사용자 전송 · 보고서 · 맵.

### 2.2 판정에 쓰이는 것은 **4가지**뿐입니다   📄

```
엑세스 그룹 · 도어 시간대 · 사용자 시간대 · 사용자 발급일/만료일
```

도어 시간대와 사용자 시간대는 **AND** 로 처리 됩니다.

> **알아두기**
> *"카드 사용자가 출입을 하기 위해서는 3가지 조건이 맞아야 합니다. 카드번호 · 도어 접근 권한(도어그룹) ·
> 시간 접근 권한(시간코드). 위 3가지 중 하나라도 어긋나면 ACU는 사용자에게 출입을 제한합니다."*
> 이벤트 **거부 이유 3가지** → **2.4.1**

🟢 **사용자 카드정보에는 그룹 8개중 하나만 통과하면 인증됩니다**

### 2.3 지원하지 않는 기능은 **오류가 아닙니다**   ✅

ACAM40이 지원하지 않는 명령을 보내면 결과창에 이렇게 뜹니다.

```
이 장비에서 지원하지 않는 기능입니다.          ✅ 초록 체크 (전송 완료)
```

**빨간 실패가 아닙니다.** ACU 고장이 아니라 **"이 ACU 에는 해당 없음"** 이라는 뜻이니
그냥 넘어가시면 됩니다.

![지원하지 않는 기능이 초록 체크로 뜬 모습](images/trans-result-notsupported.png)

위 그림은 ACAM01 을 업데이트한 결과입니다. **전체 62 · 성공 62 · 실패 0** 이고,
줄마다 결과가 `이 장비에서 지원하지 않는 기능입니다.` 인데도 **모두 초록 체크**입니다.
전체 목록은 **부록 A** 에 있습니다.

---

### 2.4 문제가 생겼을 때 — 문서 어디를 보나?

#### 2.4.1 먼저 **이벤트 화면에서 승인 거부 이유**를 보세요   ✅

| 이벤트 | 내용 | 문서 위치 |
|---|---|---|
| 승인 거부 › **허용안함** | ACU에 **사용자 정보가** 없습니다 | `사용자 전송` 을 했는지 · **4.9** |
| 승인 거부 › **타임존** | 리더기 **사용 시간대**가 아닙니다 | 카드리더 속성의 **도어 시간대 번호** · **4.6** |
| 승인 거부 › **권한 레벨(등급)** | **사용자 정보**의 그룹 · 시간대가 안 맞습니다. **권한을 회수한 사용자**도 이렇게 뜹니다 | 엑세스 그룹 **4.5** · 사용자 시간대 · 회수 **4.9** |
| 승인 거부 › **인증유효기간** | 사용자 **발급일 전이거나 만료일이 지났습니다** | **4.8** |
| **이벤트 내용 없음** | 카드를 못 읽었습니다 | **2.4.3** |

> **⚠ 주의** — **`권한 레벨(등급)` 은 이름이 잘못 붙은 것입니다.**
> ACAM40 에 등급 개념은 없습니다(3.2). 이 줄이 뜨는 진짜 뜻은
> **"카드에 실린 (엑세스 그룹, 시간대) 짝이 그 문을 못 연다"** 입니다.
> ⇒ 등급이 아니라 **엑세스 그룹과 사용자 시간대**를 보세요.

```
태그 → ① 그 문의 시간대가 지금 열려 있나?     아니면 → 거부 › 타임존
     → ② 카드의 (엑세스 그룹, 시간대) 가 맞나?  아니면 → 거부 › 권한 레벨(등급)
```

#### 2.4.2 증상으로 찾기

| 증상 | 먼저 볼 문서 위치 |
|---|---|
| 특정 한 사용자만 안 열린다 | 그 사람의 **발급일 · 만료일 · 사용자 시간대 · 그룹 소속** (4.8 · 4.9) |
| **이벤트가 아예 안 뜬다** | 🔴 **사용자 ID 가 `1`~`20000` 의 숫자인지** — 범위 밖이면 ACU로 안 나갑니다 (3.1) |
| 한 사용자에게 그룹을 더 줬는데 안 먹는다 | 🔴 **그룹은 한 사람에 8개까지**입니다. 9개째는 전송이 안됩니다 (3.1) |
| 한 그룹이 통째로 안 열린다 | **`추가`를 눌렀는지** (4.5). 안 눌렀으면 ACU 안의 표가 비어 있습니다 |
| 그 ACU 의 **모든 문**이 안 열린다 | 컨트롤러 동기화가 끊겼는지 (4.11) → **4.1 설정 다운로드** |
| 특정 시간에만 안 열린다 | 도어 시간대와 사용자 시간대가 **AND** 로 겹칩니다 (2.2) |
| 새로 만든 시간대인데 안 열린다 | **시간대 내용을 보냈는지** (4.6) |
| 등록한 카드인데 `허용안함` 으로 막힌다 · 대도 반응이 없다 | **2.4.3** |
| 아무도 없는데 이벤트가 쏟아진다 | **2.4.4** |
| 전송 결과가 `읽기 에러` 인데 동작은 바뀌었다 | **2.4.5** — 읽기 타임아웃 20초 |
| 아무나 모든 문을 연다 | **4.5 경고** — 엑세스 그룹 0건일 때 보낸 카드입니다 |
| **열림 · 닫힘을 눌렀는데 듣지 않는다** | **4.10** — 강제개방 상태입니다 |

#### 2.4.3 등록한 카드인데 `허용안함` 으로 막히거나, 대도 반응이 없을 때   ✅

**증상 ①** 등록한 카드인데 대면 **`승인 거부 › 허용안함`** 이 뜹니다. **같은 리더에서 여러 명이** 그렇습니다.

**원인** 그 리더의 **카드 포맷(정순 · 역순)** 이 실제로 물린 리더기와 다릅니다.
카드번호의 **바이트 순서가 뒤집혀** 올라와서, ACU 가 **없는 카드**로 봅니다.

```
등록한 번호   fa 76 b1 bd
ACU 가 읽은 번호   bd b1 76 fa      ← 순서가 뒤집혔다 → 없는 카드 → 허용안함

등록한 번호   9a d6 54 be
ACU 가 읽은 번호   be 54 d6 9a      ← 역방향 리더기를 정순으로 설정 → 허용안함 (역순으로 바꾸자 열림)
```

**조치** **4.4 카드리더 설정하기**에서 `ACAM-40` 탭의 **카드 포맷**을 반대쪽(정순 ↔ 역순)으로 바꾸고 `저장` → `실행` 하세요.

> **알아두기** — 카드 포맷을 비워 두면 **정순**으로 나갑니다. 역순 리더기라면 반드시 골라 주세요.

**증상 ②** **한 사용자만** `허용안함` 이 뜹니다.

**원인** 그 사용자의 **카드번호**입니다. 번호를 잘못 넣었거나, 카드번호가 **8자리(16진수)를 넘으면**
ACU 로 **보내지 않습니다** — ACAM40 은 카드번호를 4바이트까지만 담습니다.   📄

**조치** 사용자 속성의 `근접 인식` 탭에서 카드번호를 확인하고 **`사용자 전송`** 을 다시 하세요(4.9).

**증상 ③** 카드를 대도 **이벤트가 아예 안 뜹니다.**

**원인** 리더가 카드를 **읽지 못했습니다** — 리더의 배선 · 전원 · 통신 문제입니다.
`통신 › 하드웨어 패킷 › 프레임 오류` 가 뜨면 리더와 ACU 사이 통신이 깨진 것입니다(6장).   📄

#### 2.4.4 태그를 안 했는데 이벤트가 쏟아지면   ✅

**증상** 아무도 카드를 대지 않는데 이벤트가 끝없이 올라옵니다.
`입력 정상복귀` / `입력 화재센서 알람발생` 이 번갈아 찍힙니다.

**원인** 배선하지 않은 입력점이 켜져 있습니다. 특히 **NC** 는 "평상시 닫혀 있어야 정상" 이라
아무것도 연결하지 않은 단자가 **영구 알람**으로 읽힙니다.

**조치** **4.1 설정 다운로드**를 한 번 하세요. 입력점을 비웁니다.

> **⚠ 주의** — **앱을 새로 깔아도 안 없어집니다.** 설정은 **ACU 안에** 들어 있습니다.
> 이미 이벤트가 가득 찬 뒤라면 **전원을 껐다 켜도 안 풀립니다.**

#### 2.4.5 전송 결과가 `읽기 에러` 인데 ACU 에는 들어갔을 때   ✅

**증상** 공휴일 보내기처럼 오래 걸리는 전송에서 **ACAM40 만** 결과 창에 `읽기 에러` 가 뜹니다.
그런데 태그해 보면 **바뀐 내용대로 동작합니다.**

**원인** ACAM40 은 공휴일을 **하루에 한 번씩** 받습니다. 67일이면 **약 11초**가 걸리는데,
Platinum 은 결과를 **읽기 타임아웃(기본 10초)** 까지만 기다리고 실패로 표시합니다.
전송은 그동안에도 계속되어 ACU 에는 끝까지 들어갑니다.

**조치** 읽기 타임아웃을 **20초**로 올리세요. **ACAM40 현장은 설치할 때 이렇게 맞춰 두세요.**

**Step 1.** 메뉴에서 **`도구 → 네트워크`** 를 클릭합니다. `서버 설정` 창이 열립니다.
**Step 2.** **`읽기 타임아웃(ms)`** 에서 **`20000`** 을 선택하고 저장합니다.
**Step 3.** Platinum 을 다시 실행합니다.

> **알아두기** — 20000 이 고를 수 있는 가장 큰 값입니다. 공휴일을 최대치(100일)까지 넣어도 약 16초라 들어갑니다.
> 대신 장비가 정말 응답하지 않을 때 실패를 알기까지 **ACU 한 대당 20초**를 기다립니다.

## 3. 알아두기

### 3.1 한도 — 쓸 수 있는 번호 범위   📄

| | **ACAM40** | **IDTi** (SSC-324) |
|---|---|---|
| 엑세스 그룹 | `1` ~ **`255`** ⚠ 아래 | `1` ~ **`1024`** |
| 시간대 | `1` ~ **`98`** | `1` ~ **`512`** |
| 유효기간 | ➖ 기능 없음 | `1` ~ **`512`** |
| 사용자그룹 | `1` ~ **`255`** | `1` ~ **`1024`** |
| 권한 레벨(등급) | ➖ 기능 없음 | `1` ~ `14` · 관리자 `63`·`95`·`127` |
| 한 사람의 그룹 | **8개** | **8개** (같음) |
| 사람 | **20,000명** | **100,000명** ⚠ 아래 |
| 리더 · 입력 · 출력 | **8 · 8 · 8** | 리더 4 · 입력 16 · 출력 8 |
| ACU 주소 | `1` ~ **`16`** — 보드 로터리 스위치(SW3) `0`~`F` + 1 | `1` ~ `32` |

> **⚠ 주의 — 엑세스 그룹 번호 `143` 과 `159` 는 쓰지 마세요.**   📄
> SS2006 매뉴얼: *"모든 컨트롤러에 도어그룹은 1 부터 254 까지 최대 252 개를 설정할 수 있습니다.
> **143 번과 159 번은 컨트롤러에서 자체적으로 사용하고 있어 사용할 수 없는 도어그룹번호**입니다."*
> 펌웨어의 자리 수는 255 지만 **운영에서 쓸 수 있는 것은 252 개**입니다.
> 이 번호를 쓰면 **오류 없이 조용히 어긋납니다.** ⬜ 실물로 재현해 보지는 않았습니다.

> **🛑 경고 — 사용자 ID 는 `1` ~ `20000` 의 숫자여야 합니다.**
> ACU 가 그 번호를 **자리 번호로** 씁니다. 범위 밖이거나 숫자가 아니면 **ACU로 아예 전송이 안됩니다.**
> 화면에는 멀쩡히 보이므로 **권한을 준 줄 알았는데 그 사용자는 등록조차 되어 있지 않습니다.**

> **알아두기** — ACAM40 본체에 **입출력확장보드**를 붙이면
> 리더 · 입력 · 출력이 최대 72 까지 늘지만, **Platinum에서는 확장보드를 지원하지 않습니다.**

### 3.2 화면에 있어도 ACAM40이 쓰지 않는 것

| 설정 | 이유 |
|---|---|
| **운영모드**(제어 · 스케줄) | 기능 없음 — ACU가 거부합니다 ✅ |
| **스케줄**(도어모드 · 알람벨) | 기능 없음 ✅ |
| **서머타임** | 기능 없음 📄 |
| **권한 레벨(등급)** | 기능 없음 — 바꿔 보내도 카드에 실리는 값이 같고 결과도 같습니다 ✅ <br>⚠ 그런데 **이벤트에는 `권한 레벨(등급)` 이라는 거부 사유가 뜹니다** — 이름만 그럴 뿐 뜻이 다릅니다 → 2.4.1 |
| 인터록 · 투맨 · 출입구역 | 기능 없음 📄 |

전체 목록은 **부록 A** 에 있습니다.

### 3.3 ACAM40에는 있는데 **Platinum에서 지원 못 하는 기능**   📄

> **알아두기** — 아래는 **ACAM40에 기능이 있습니다.** 하지만
> Platinum에서 **구조적**인 문제로 지원 하지 않는 것입니다.

| 기능 | ACAM40 매뉴얼 내용 | Platinum |
|---|---|---|
| **안티패스백(APB)** | 도어마다 `적용 = YES` 로 켜고 **APB 코드 1~8** 과 **입문/출문** 을 정합니다. 한 코드에는 입문과 출문이 **각각 하나 이상** 있어야 합니다 | 🔴 **칸은 있지만 모양이 다릅니다** — 아래 |
| **출력그룹** | *"모든 컨트롤러에 출력그룹은 1 부터 100 까지 최대 100 개"* | ➖ 대응 화면 없음 |
| **입력그룹 · 입출력연동규칙** | 입력그룹이 출력그룹을 **묶어서** 움직이게 합니다 | ➖ 대응 화면 없음. Platinum 은 입력센서의 **반응 모듈 · 반응 장치**로 **1 대 1** 연동만 합니다(4.2) |
| **지문리더기** | *"00 번부터 31 번까지 최대 32 개"* · 컨트롤러와 **별도 네트워크**로 관리 | 🔴 `지문리더 값 변경`은 ACAM40 에서 안 받습니다(부록 A) |

#### 안티패스백은 왜 Platinum 에서 안 되는가   📄

Platinum 에도 **안티패스백이라는 칸은 있습니다.** 사용자 · 사용자그룹 · 장치의
`장치옵션` 탭에 체크박스 세 개(`안티패스백 적용` · `지역 안티패스백` · `글로벌 안티패스백`)가
있습니다. 그런데 **그 칸이 담는 것이 ACU가 기다리는 것과 다릅니다.**

| | 무엇을 기준으로 켜나 | 무엇을 적나 |
|---|---|---|
| **ACAM40** | **리더 마다** | 이 문은 **APB `3`번 구역의 `입문`** 이다 |
| **Platinum** | **사용자 마다** | 이 사람에게 APB 를 **쓴다 / 안 쓴다** (한 칸) |

🔴 **Platinum 의 칸에는 「구역 번호」와 「입문 / 출문」을 적을 자리가 아예 없습니다.**
IDTi(SSC-324) 를 기준으로 만든 칸이기 때문입니다. 그래서 체크를 해도 **ACAM40 이 알아들을
모양으로 나갈 수가 없습니다.** 게다가 ACAM40 에서는 **`장치옵션` 탭이 통째로 잠깁니다**(4.2 · 4.3).

➡️ **ACAM40이 못 하는 것이 아니라, 구조가 다릅니다.**

> **⚠ 주의 — APB 이벤트는 실제로 올라옵니다.**
> Platinum 에서 APB 를 켤 수 없어도, **SS2006 프로그램으로 켜 둔 현장**이라면
> `인증 › 승인 거부 › 안티 패스 백`(`0102010c`) 이 이벤트에 뜹니다(6장).
> **거부 사유 셋(2.4.1)에 안 들어가는 넷째 사유**라 *"카드도 그룹도 맞는데 안 열린다"* 로 보입니다.
>
> SS2006 프로그램에는 그 이벤트를 눌러 **APB 규칙을 초기화**하는 길이 있습니다.
> ⬜ **Platinum 에는 해제 하는 길이 확인되지 않았습니다.**
> ⇒ **현장에 APB 가 켜져 있는지 먼저 확인하세요.** 안 켜져 있으면 겪을 일이 없습니다.

### 3.4 용어 대조   📄

> **이 문서는 왼쪽 칸(Platinum 화면 말)을 씁니다.** 오른쪽은 **장치관리자 로그**에서 만납니다.

| Platinum 매뉴얼 용어 | ACAM40 매뉴얼 용어 | 갯수 | 비고 |
|---|---|---|---|
| **엑세스 그룹** · 장치그룹 | **도어그룹** | **252개** (`1`~`254`, `143`·`159` 제외) | 화면에 두 이름이 다 나옵니다. 같은 것입니다 |
| **시간대** | **타임코드** | **98개** (`1`~`98`) | 🔴 **번호가 다릅니다: ACAM 번호 = 시간대 번호 + 2** |
| 사용자그룹 | 도어그룹 **번호** | 한 사람에 **8개** | 1:1 로 같은 번호를 씁니다 |
| 사용자 | **카드(PID)** · 출입증 | **20,000명** | 🔴 **사용자 ID 가 곧 자리 번호**입니다 → 3.1 |
| 카드리더 | 리더 = **도어** = 출력점 | | ACAM40 은 셋이 같은 번호입니다 |
| 설정 다운로드 | **환경파일 전송** | | SS2006 프로그램에서 부르는 이름입니다 → 4.1 |

로그에 보이는 `출입 시간대 1 → 타임코드 3` 은 그 번호 변환입니다. 같은 것을 가리킵니다.

> **알아두기 — 시간대 번호 `1`·`2` 는 ACU 가 예약해 두었습니다**(1=항상 거부, 2=항상 허용).
> 그래서 화면의 시간대 1번이 ACU 안에서는 3번입니다.
> **운영자가 계산할 일은 없습니다** — 프로그램이 알아서 바꿔 보냅니다.

### 4.1 ACU 설정하기 — **설정 다운로드하기**   ✅

> **ACAM40 운영에서 가장 중요한 버튼입니다.**

**Step 1.** 장치관리 트리 메뉴에서 `장치 관리 → 장치 설정` 을 클릭합니다.
**Step 2.** 장치 설정 트리에서 대상 ACU 를 선택합니다.
**Step 3.** 오른쪽 `기본정보` 탭 아래쪽 **`세부 설정`** 그룹을 봅니다.
**Step 4.** **`다운로드 설정`** 오른쪽의 **`다운로드`** 버튼을 클릭합니다.

![장치 설정의 세부 설정 - 다운로드 버튼](images/dev-detail-download.png)

**무엇이 나가나요**

```
ACU정보 → 동작 중지 → 시간 → 공휴일(비우고 전체) → 시간대 리스트 전체
       → 도어그룹(전 도어 + 사용자그룹별) → 입력점 · 출력점 · 리더 · 도어 → 동작 시작
```

🟢 **다운로드 버튼 클릭 한번으로 ACU 설정이 완료됩니다.** 화면 여럿을 순서대로 누를 필요가 없습니다.

**이럴 때 누르세요**

- 신규 설치 · ACU 교체 후
- 태그를 안 했는데 이벤트가 쏟아질 때 (2.4.4)
- 컨트롤러 동기화가 중간에 끊겼을 때 (4.11)
- DIP 8번 초기화 후

> **⚠ 주의** — **사용자정보(카드정보)는 안 나갑니다.** 사용자 전송이 맡습니다(4.9).
> **공휴일은 연도가 박힙니다** — 해가 바뀌면 다시 하세요(4.7).

> **알아두기** — **`장치 설정 → 세부 설정 → 다운로드`** 와 **장치관리자(IntelliScan Device Manager)의 `Download`** 는
> **같은 기능**입니다. 어느 쪽을 눌러도 결과가 같습니다.
> SS2006 프로그램에서는 이것을 **`환경파일 전송`** 이라고 부릅니다.

> **알아두기** — 컨트롤러를 등록할 때 넣는 **주소(`1`~`16`)는 보드의 로터리 스위치(SW3) 값 + 1** 이어야 합니다.
> 스위치는 `0`~`F`(16진수)로 되어 있습니다 — 스위치 `0` 이면 주소 `1`, `F` 이면 주소 `16` 입니다.
> SS2006 문서도 *"ACAM40 컨트롤러 ID 는 실제 ACU 의 컨트롤러 ID 와 동일해야 한다"* 고 못박습니다.
> 그래서 한 네트워크에는 ACU 를 **16대까지** 둘 수 있습니다. ✅
> (ACU 펌웨어가 켜질 때 스위치 값에 1 을 더해 자기 주소로 삼고, 장치관리자는 등록한 주소를 그대로 보냅니다.
> 스위치 `0` 인 ACAM01 을 주소 `1` 로 등록해 운영 중 — 2026-10-01 확인)

> **입력점 1 → 문 1(리더 1)**, **입력점 2 → 문 2(리더 2)** … 로 고정입니다. 반응 설정으로는 바꿀 수 없습니다.
> 번호가 어긋나면(예: 리더 1 의 문 센서를 입력점 3 에 연결) 카드로 연 문을 ACU 가 **"인증 없이 열렸다"**
> 로 보고 **`문 강제 열림`** 을 올립니다.
> ⇒ 도어센서 선은 **그 문을 여는 리더와 같은 번호의 입력점**에 연결하세요.

> **⚠ 주의** — **`저장` 버튼은 명칭 · 설명 · 사용함만 저장합니다.**
> 나머지 값은 **`실행`** 을 눌러야 ACU 와 DB 에 함께 들어갑니다. IDTi 도 같은 방식입니다.

> **🛑 경고 — 문이 닫혀 있을 때 하세요.**
> ACAM40 펌웨어는 입력점 설정을 새로 받으면 **그 입력의 현재 상태를 지우고 다시 읽습니다.**
> 그때 입력이 활성 상태(문이 열려 있다 · 버튼이 눌려 있다)면 **새로 생긴 알람으로 보고
> 반응 릴레이를 울립니다.** ✅
> 출력릴레이도 마찬가지입니다 — **설정을 받으면 켜져 있던 릴레이의 타이머가 지워져
> 열려 있던 문이 그 자리에서 닫힙니다.**(4.3)

**설정 받아오기** — 🟢 `설정 받기` 와 `업데이트` 는 **둘 다 ACU 설정 값을 받아 옵니다.** ✅

| ACU 질의 응답 | 🟢 예 | 🟢 예 |
| 받은 값 | **화면에 바로 표시** DB 에도 저장 | **DB 에만** 저장 |
| 화면 | 즉시 표시 | 창을 닫으면 **DB에서 다시 불러옴** |

### 4.4 카드리더 설정하기   ✅

> **카드 포멧과 출입문 허용 시간대를 설정하는 창입니다.**
> 설정을 잘못 하면 **카드를 아예 못 읽습니다.**

**Step 1.** 장치 설정 트리에서 리더를 클릭합니다.
**Step 2.** 카드 포맷 · 도어 시간대 설정 합니다.
**Step 3.** `저장` 후 `실행` 을 클릭합니다. **리더와 도어 2개의 데이터**가 전송 됩니다.

![카드리더 속성 - ACAM](images/reader-property-acam_1.png)

> **알아두기 — ACAM40에서는 리더 = 도어 = 출력점이 같은 번호입니다.**
> 리더1은 도어1이고 출력1 입니다. SS2006 문서도 *"리더기는 모두 도어와 1:1 로 연동"*
> 이라고 되어 있습니다.

**시간대 번호만 바꾼 것인지, 내용까지 바꾼 것인지 가르세요.**

```
도어 타임존 변경                    → 이 창의 실행으로 충분합니다
시각·요일을 수정 · 처음 쓰는 번호      → 4.6 으로 내용을 먼저 보내야 합니다
```

> **⚠ 주의** — **변경된 내용을 저장만 하고 카드리더 설정 변경을 실행 안 하면 그 문은 아무도 못 엽니다.**
> ACU 에 없는 번호를 가리키게 되기 때문입니다.

### 4.5 엑세스 그룹 설정   ✅

> **"어느 그룹이 이 문을 쓸 수 있는가" 를 ACU에 전송하는 창입니다.**
> 사람에게 그룹을 주는 것(4.9)과 **다른 일**입니다 — 둘 다 해야 문이 열립니다.

**Step 1.** 카드리더 속성 창에서 `기타정보` 탭을 클릭합니다.
**Step 2.** 엑세스 그룹을 고릅니다.
**Step 3.** `추가` 또는 `삭제` 를 클릭합니다.

![카드리더 속성 기타정보 - 엑세스 그룹 추가/삭제](images/reader-etc-accessgroup.png)

| 구분 | 내용 |
|---|---|
| **추가** | 그 리더에 그 엑세스 그룹 추가 |
| **삭제** | 그 리더에 그 엑세스 그룹 삭제 |

**순서가 있습니다.**

```
① 카드리더 속성 → 기타정보 → 추가   (그룹을 먼저)
② 사용자 관리 → 사용자 전송        (그 다음 카드)
```

> **⚠ 주의** — **사용자 전송은 그 사용자의 카드 한 장만 보냅니다. 엑세스 그룹 리스트는 안 나갑니다.**
> 새 그룹을 만들고 사용자 전송만 하면 카드가 **ACU에 없는 그룹 번호**를 가리켜
> **그 카드는 아무 문도 못 엽니다.**

> **⚠ 주의 — 그 ACU 에서 처음 쓰는 엑세스 그룹이면, `추가` 한 뒤 그 그룹 사용자들을 `사용자 전송` 하세요.**   📄
> 카드에는 **그 ACU 에서 열 수 있는 그룹만** 실립니다. 그룹이 처음 붙기 전에 보낸 카드에는 그 그룹 칸이 없어서,
> `추가` 만으로는 그 사람들이 열리지 않습니다.
> 그 ACU 에서 이미 쓰던 그룹을 다른 리더에 더 붙이는 것은 **`추가` 한 번으로 바로 반영**됩니다. ✅

> **🛑 경고 — 엑세스 그룹이 하나도 없는 ACU에 보낸 카드는 「전체 허용」으로 설정 됩니다.**
> 그 뒤에 그룹을 만들어도 **그 카드는 표를 보지 않습니다** — 계속 모든 문이 열립니다.
> ⇒ **0건 → 1건 이상으로 넘어가는 순간, 카드를 전부 다시 보내세요.**
> (이미 1건 이상인 상태에서 그룹 내용만 바꾸는 것은 표만 보내면 됩니다.)
> ⬜ 장비 규격에서 나온 이야기이고, 실장비로 재현해 보지는 않았습니다.

> **⚠ 주의 — 삭제는 취소할 수 없습니다.** 되돌리려면 **`추가`** 로 다시 넣으세요.
> 상태 표시가 화면마다 다릅니다 — **같은 상태인데 이름만 다릅니다.**
>
> ```
> 엑세스 그룹 화면      "삭제 대기"   · 저장 전이면 [취소] 로 되돌릴 수 있습니다
> 장치 설정 → 기타정보  "비동기화"    · 곧바로 실행됩니다. 취소가 없습니다
> ```

![엑세스 그룹 화면 - 동기화 안내와 삭제 대기](images/accessgroup-list-sync.png)

### 4.7 공휴일 보내기   ✅

> **공휴일 도어 컨트롤을 평일과 달리 제어 하기 위해서 ACU에 공휴일 정보를 전달 합니다.**
> ACAM40은 **해마다 다시 보내야** 합니다.

**Step 1.** 메뉴에서 `장치 관리` 를 클릭합니다.
**Step 2.** 왼쪽 메뉴 트리에서 **`장치 데이터 통신 → 휴일`** 을 클릭합니다.
**Step 3.** 아래 콤보에서 **`휴일 보내기`** 을 선택 합니다.
**Step 4.** `휴일스케쥴 기간` 에서 연도를 선택하고, 목록에서 ACU 를 고릅니다.
**Step 5.** 아래 **`실행`** 을 클릭합니다.

![장치 데이터 통신 - 휴일](images/holiday-send.png)

> **⚠ 주의 — ACAM40의 공휴일에는 연도가 표시 됩니다.**
> IDTi 와 달리 **매년 반복되지 않습니다.**
> **해가 바뀌면 그 해 공휴일을 다시 내려보내야 합니다.**

🔴 **`휴일 받기` 는 ACAM40 에서 지원하지 않습니다**(부록 A). IDTi 에서는 됩니다.

> **💡 팁** — ACAM40 은 공휴일을 하루씩 받아 **10초가 넘게** 걸립니다. 결과가 `읽기 에러` 로 나오면 **2.4.5** 를 보세요.

### 4.8 인증 유효기간 — **사용 기한 주기**   📄

> **ACAM40은 사용자 정보에만 유효기간이 있습니다.**
> 발급일 전이거나 만료일이 지났으면 출입을 허용하지 않습니다. 유효기간 시작일과 종료일은 **사용자 정보에 실려** ACU 로 전달됩니다.
> ACU에는 인증 유효기간 목록 저장소가 따로 없습니다.

```
ACAM40이 구조에 있는 것      사용자 속성 → 일반 탭 → 발급일 · 만료일    ← 이 둘이 ACU로 갑니다
ACAM40이 구조에 없는 것      인증 유효기간(번호) · 그 기간의 발급일 · 만료일
```

> **⚠ 주의 — `인증 유효기간` 목록은 ACAM40에서 기능이 없습니다.**
> 이름이 비슷해서 헷갈리기 쉽습니다. 아래 **세 자리는 모두 IDTi(SSC-324) 용**입니다.
>
> | 메뉴 위치 | ACAM40에서 |
> |---|---|
> | `장치 데이터 → 인증 유효기간` (유효기간 만들기) | 목록은 만들어지지만 **ACU로 전송 명령이 없습니다** |
> | 사용자 속성 → `사용자 장치옵션` 탭 → **인증 유효기간** 콤보 | 선택해도 **ACU로 전송 명령이 없습니다** |
> | `장치 데이터 통신 → 인증 유효기간` → `실행` | **`지원하지 않는 기능입니다`** 로 표시 됩니다 — 정상입니다(2.3) |
>
> ⇒ ACAM40에서 기한을 두려면 **이 절의 발급일 · 만료일**을 쓰세요.

#### 4.8.1 발급일 · 만료일 설정하기

**Step 1.** 사용자 관리 메뉴 트리에서 사용자 정보 → 현재 사용자를 클릭합니다.
**Step 2.** 현재 사용자에서 신규 또는 설정을 변경 하려는 사용자를 선택 하고 속성 버튼을 클릭해 **사용자 속성**을 엽니다.
**Step 3.** `일반` 탭의 **`발급일`** 과 **`만료일`** 을 선택 합니다.
**Step 4.** `사용자 장치옵션` 탭의 **`인증 만료일`** 이 같은 날짜로 바뀌었는지 확인 합니다(회색 칸 · 직접 수정 하지 못합니다).
**Step 5.** `저장 & 닫기` 를 클릭합니다.

![사용자 속성 - 인증 만료일(오른쪽 회색 칸)과 인증 유효기간 콤보](images/user-validation_3.png)

위 그림에서 **ACU로 가는 것은 오른쪽의 `인증 만료일`** 입니다(발급일은 `일반` 탭에만 보입니다).
왼쪽의 `인증 유효기간` 콤보는 ACAM40 에서 쓰이지 않습니다.

| 날짜 | ACU 판정 | 새로 만들 때 기본값 |
|---|---|---|
| **발급일** | 오늘이 발급일 **전**이면 불허 합니다. **발급일 당일부터** 열립니다 | 오늘 |
| **만료일** | 오늘이 만료일 **뒤**면 승인 합니다. **만료일 당일까지** 열립니다 | 50년 뒤 |

> **알아두기** — 두 날짜는 **2099년 12월 31일까지** 쓰세요. ACAM40의 연도가 두자리 인식이라
> 2100년 이후는 `00년` 이 되어 판정이 어긋납니다.   📄

#### 4.8.2 발급일 · 만료일 보내기 — **사용자 전송**

**Step 1.** 날짜를 고친 사용자를 **`사용자 전송`** 합니다(4.9).

이것 하나면 완료 됩니다. 두 날짜는 **그 사용자의 정보와 함께** 전송 됩니다.
기간 밖이면 ACU가 막고 **`인증 › 승인 거부 › 인증유효기간`** 이벤트를 올립니다(6장).
발급일 전이든 만료일 뒤든 **이벤트 이름은 같습니다.**

> **⚠ 주의 — 날짜만 고치고 사용자 전송을 안 하면 ACU는 옛 날짜를 그대로 씁니다.**
> 여러 사용자를 한꺼번에 바꿨다면 **바꾼 사용자 전부**를 보내야 합니다.

> **알아두기 — 왜 `장치 데이터 통신` 으로 보내지 않나요?**
> IDTi 는 **인증 유효기간 목록(번호 → 발급일 · 만료일)을 ACU 안에 따로** 두고, 사용자는 번호만 가리킵니다.
> 그래서 목록을 `장치 데이터 통신` 으로 따로 보냅니다.
> **ACAM40에는 그 목록을 저장하는 자리가 없습니다.** 사용자 정보마다 **발급일 · 만료일**이 직접 보관 되어 있습니다.
> 그래서 목록을 보내는 명령은 받지 않고(`지원하지 않는 기능입니다`),
> **사용자 정보에 실어** 전송 하는 방법만 있습니다.

![장치 데이터 통신 - 인증 유효기간 (ACAM40 은 지원하지 않는 기능)](images/validation-send.png)

### 4.9 사용자 신규 및 변경 설정   ✅

**신규** — 사용자 관리에서 그 사용자의 **엑세스 그룹 · 시간대 · 발급일 · 만료일**을 정하고
**`사용자 전송`** 을 누릅니다. 새 엑세스 그룹이면 **4.5 의 `추가`를 먼저** 하세요.

**변경** — 엑세스 그룹 · 시간대 · 날짜를 바꿨으면 **`사용자 전송`** 을 다시 누르세요.
ACU에 있던 그 사용자의 정보가 **새 설정으로 덮어써집니다.**

**출입 권한 회수** — 엑세스 그룹을 빼고 **`사용자 전송`** 을 하면 됩니다.   ✅

`사용자 전송` 은 **ACU 마다 따로** 나갑니다.
그 ACU 에서 이 사용자가 열 수 있는 문이 **하나도 안 남으면**, 장치관리자가 그 ACU 의 카드를
**권한이 빈 사용자로 덮어씁니다.** 그 사용자가 카드를 대면 **`승인 거부 › 권한 레벨(등급)`** 으로 막힙니다.

예시 — 홍길동이 `ACAM40-01 출입` · `ACAM40-02 출입` 두 엑세스 그룹에 들어 있었을 때 `사용자 전송` 결과:

| 변경 내용 | ACAM40-01 | ACAM40-02 |
|---|---|---|
| `ACAM40-01 출입` 만 뺐다 | 🟢 빈 권한으로 덮어씀 → **승인 거부** | 🟢 새 설정으로 덮어씀 |
| 두 그룹을 다 뺐다 | 🟢 빈 권한으로 덮어씀 → **승인 거부** | 🟢 빈 권한으로 덮어씀 → **승인 거부** |
| `ACAM40-01 출입` 을 `ACAM40-01 사무실` 로 바꿨다 (ACAM40-01 문이 아직 남음) | 🟢 새 설정으로 덮어씀 | 🟢 새 설정으로 덮어씀 |

**`사용자 전송` 과 `사용자 삭제` 는 이렇게 나눠 씁니다.** 둘 다 문은 안 열립니다.

| 구분 | ACU의 저장소 내용 | 카드 태그 | 비고 |
|---|---|---|---|
| 엑세스 그룹을 빼고 **`사용자 전송`** | 사용자 정보는 있고 권한은 없음 | 승인 거부 › **권한 레벨(등급)** | 이 문 · 이 ACU 만 막을 때 |
| **`사용자 삭제`** | 사용자 정보 없음 | 승인 거부 › **허용안함** | 퇴사 등 사용자를 없앨 때 |

`사용자 삭제` 는 **`사용자 데이터 통신 → 사용자` → 실행 콤보 `사용자 삭제`**(원본 §4.4 vi)에 있습니다.
**삭제 할 ACU 만** 골라 실행하면 됩니다.

> **💡 팁 — 지워졌는지 ACU에 직접 물어볼 수 있습니다.**
> 같은 화면의 실행 콤보에서 **`사용자 등록 확인`** 을 선택 하고 그 사용자가 ACU 에 **있는지 · 없는지**를 회신 합니다.
> 삭제 뒤 "없다"로 바뀌면 삭제 된 것입니다.

> **⚠ 주의 — `사용자 동기화` 로는 권한 회수가 되지 않습니다.**
> `사용자 데이터 통신 → 사용자 동기화` 는 ACU 를 선택 하면 **DB 의 전체 사용자**를 보내는데,
> 그 ACU 에 권한이 없는 사용자는 **건너뜁니다** — 옛 사용자가 그대로 남습니다.
> 실행할 때 *"장치에 있던 사용자가 전부 지워진다"* 는 확인창이 뜨지만 **ACAM40 에서는 먼저 지우지 않습니다.**
> 권한을 뺀 사용자는 **`사용자 정보` 화면에서 `사용자 보내기`** 로 보내세요 — 몇 명을 선택 하든 한 명씩 나가서 권한 설정이 변경 됩니다.

> **⚠ 주의 — 전송창에 `실패 - 패킷정보가 유효하지 않습니다.` 가 뜨는 사용자**   📄
> 대개 그 사용자의 **엑세스 그룹 정보가 DB 에 없는** 경우입니다. 이때 그 사용자는 **ACU 로 전송되지 않고**,
> ACU 에는 전송 전 사용자 정보가 그대로 남습니다.
> 사용자 속성을 열어 엑세스 그룹을 정하고 저장한 뒤 다시 보내세요.

> **⚠ 주의 — 일괄적용은 DB만 바꿉니다. ACU로는 아무것도 전송이 안됩니다.**   📄
> 설정 변경 뒤에 **`사용자 전송`** 을 따로 하세요.

### 4.10 문 열고 닫기   ✅

`장치 데이터 통신 → 출력릴레이 컨트롤` 에서 전송합니다.

| 동작 구분 | ACAM40에서 동작 |
|---|---|
| **열림** (활성화 시간 N초, `1`~`99`) | 문이 열리고 **N초 뒤 저절로 닫힙니다** |
| **열림 도중에 `닫힘`** | **즉시 닫힙니다.** 그 뒤 다시 `열림` 을 누르면 정상으로 열립니다 |
| **닫힘** | **즉시 닫습니다.** 잠그지는 않습니다 — 카드를 대면 평소처럼 열립니다   📄 |

> **⚠ 주의 — 강제개방 중에는 열림 · 닫힘이 안됩니다.**
> Platinum 의 `출입문 강제개방 모드` 는 **`강제개방` · `일반` 둘뿐**입니다 — 강제잠금은 고를 수 없습니다.
> **ACAM40 과 IDTi 가 갈리는 자리입니다.**
>
> | 구분 | 강제 상태에서 `열림` 또는 `닫힘` |
> |---|---|
> | **IDTi** | 🟢 그대로 동작합니다 |
> | **ACAM40** | 🔴 **ACU가 거부합니다.** 아무 동작도 하지 않습니다 |
>
> ACU 고장이 아닙니다. ACAM40 펌웨어는 출력점이 **평상(스케줄) 상태일 때만** 열림 · 닫힘을
> 수행하고, 강제 상태이면 거절하도록 만들어져 있습니다.
> SS2006 프로그램도 같은 구조입니다 — *"이 기능(강제개방 · 강제폐쇄)이 더 이상 필요치 않으면
> **자동모드로 전환**해 두어야 합니다."* 📄

화면에는 이렇게 뜹니다.

```
강제개방 중에는 열림·닫힘을 쓸 수 없습니다. 먼저 해제하십시오.
```

➡️ **해제하는 방법은 하나입니다.**

```
장치 관리 → 장치 데이터 통신 → 출입문 강제개방 모드
  → 실행 콤보 「출입문 강제개방 모드 변경」 → 모드를 「일반」 으로 → 실행
```

🔴 **`닫힘` 으로는 안 풀립니다.** 같은 명령을 다시 보내도 답은 같습니다 —
**상태를 먼저 바꾸셔야 합니다.**

### 4.11 ACU 와 DB 맞추기 — 업데이트 · 컨트롤러 동기화   ✅

> **방향이 반대인 두 기능입니다.** 헷갈리지 마세요.

```
업데이트          ACU → DB    ACU 에 물어보고, 받은 값을 DB 에 씁니다        ACU 는 바뀌지 않습니다
컨트롤러 동기화    DB → ACU    DB 의 값으로 ACU 를 다시 덮어씁니다             DB 는 바뀌지 않습니다
```

#### 4.11.1 업데이트 — ACU 값을 DB 로 받아 오기

**Step 1.** 장치 설정 트리에서 ACU 나 장치(리더 · 입력센서 · 출력릴레이)를 선택합니다.
**Step 2.** 창 아래 **`업데이트`** 를 클릭합니다.

ACU의 데이터를 받아서 **DB 에 저장합니다.** 화면은 창을 닫았다 열면 DB 값으로 다시 보입니다.
ACAM40 이 답하는 항목은 IDTi 보다 적습니다 — 결과창의 **"지원하지 않는 기능입니다"** 는 정상입니다(2.3).

ACAM40 에서 업데이트가 **DB 에 쓰는 칸**은 이것뿐입니다.   📄

| 장치 | DB 에 쓰는 칸 |
|---|---|
| 카드리더 | 리더 종류 · 카드 포맷 |
| 입력센서 | 동작설정 · 활성화 종류 · 반응 모듈 · 반응 장치 |
| 출력릴레이 | 활성화 시간 |

> **알아두기 — ACAM40 은 `장치 관리` 를 열어도 업데이트가 저절로 뜨지 않습니다.**   ✅
> IDTi 는 아직 읽어 오지 않은 ACU · 카드리더가 있으면 `장치 관리` 를 열 때 `장치 정보 업데이트` 창이 뜨지만,
> Platinum 은 **ACAM40 을 늘 "읽어 온 것"으로 칩니다.** 초기화한 ACU 를 다시 붙여도 창은 뜨지 않고 **DB 도 그대로**입니다.
> ⇒ 대신 **ACU 쪽이 비어 있다는 것을 Platinum 이 알려 주지 않습니다.**
> ACU 를 새로 설치 · 교체 · 초기화했으면 **4.1 `설정 다운로드` → 사용자 전송** 을 직접 하세요.
> 기준은 늘 **DB** 입니다 — 업데이트는 어긋남을 확인할 때 손으로 쓰는 것입니다.

진행 중에는 이렇게 보입니다.

![장치 정보 업데이트 진행 중](images/devinfo-update-running_1.png)

![장치 정보 업데이트 진행 중 2](images/devinfo-update-running_2.png)

#### 4.11.2 컨트롤러 동기화 — DB 값으로 ACU 덮어쓰기

**Step 1.** 장치 설정 → ACU 를 선택하고 `기타정보` 탭을 엽니다.
**Step 2.** 맨 아래 `컨트롤러 동기화` 를 클릭합니다.
**Step 3.** 동기화할 항목을 체크하고 실행합니다.

![컨트롤러 동기화 창](images/ctrl-sync.png)

체크한 항목마다 **ACU 쪽을 먼저 비우고(초기화) DB 값으로 다시 채웁니다.**
다만 ACAM40 은 초기화 명령을 받지 않는 항목이 많아, **실제로 나가는 것은 아래뿐입니다.**   ✅

| 체크 항목 | ACAM40에 전송 명령 |
|---|---|
| `장치 설정 동기화` | 🟡 **카드리더 · 입력센서 · 출력릴레이 설정**만 덮어씁니다. 컨트롤러 · 알람 · 운영모드 · 스케줄은 `지원하지 않는 기능` |
| `휴일 동기화` | 🟢 공휴일을 **비우고 다시** 보냅니다 |
| `타임존 동기화` | 🟡 시간대 내용을 덮어씁니다. 비우기(초기화)는 `지원하지 않는 기능` |
| `엑세스 그룹 동기화` | 🟢 리더마다 엑세스 그룹을 **비우고 다시** 넣습니다. 그룹 정의 명령은 `지원하지 않는 기능`(부록 A) |
| `인증 유효기간 동기화` | ➖ 전부 `지원하지 않는 기능` — ACAM40 은 사용자 정보로 받습니다(4.8) |
| `엘리베이터 …` | ➖ ACAM40 에서는 지원하지 않는 기능 입니다 |

⇒ **사용자(카드)는 나가지 않습니다.** 사용자는 `사용자 전송`(4.9)이 맡습니다.
결과창에 **"지원하지 않는 기능입니다"** 가 수십 줄 뜨는 것은 **정상**입니다(2.3).

> **⚠ 주의 — 초기화 · 교체한 ACU 에는 컨트롤러 동기화가 듣지 않습니다.**   ✅
> DIP 8 로 초기화했거나 새로 단 ACU 는 **설정 다운로드로 전체를 한 번 받기 전까지** 개별 설정 명령을 모두 거부합니다.
> 이때 컨트롤러 동기화를 하면 리더 · 입력 · 출력 · 휴일 · 시간대 · 엑세스 그룹이 **전부 실패**로 나옵니다.
> ⇒ 초기화 · 교체 뒤에는 **반드시 4.1 `설정 다운로드` → 사용자 전송** 순서로 하세요.

> **💡 팁 — ACAM40 에서는 4.1 `설정 다운로드` 가 같은 일을 한 번에 합니다.**
> 설정 다운로드도 DB → ACU 방향이고, 위 항목들을 ACAM40 이 알아듣는 방식으로 **한꺼번에** 풀어 넣습니다.
> 어느 쪽을 써야 할지 모르겠으면 **설정 다운로드**를 쓰세요.

> **알아두기 — 전송 · 업데이트 창은 진행 중에 닫을 수 없습니다.**
> 완료될 때까지 기다리세요. 다 끝나면 닫는 버튼이 생깁니다.
> 오래 걸리는 것이 정상입니다. 컨트롤러 동기화는 수십 줄을 차례로 보냅니다.

> **⚠ 주의 — 컨트롤러 동기화가 중간에 끊기면 그 ACU 의 문을 아무도 못 열 수 있습니다.**
> `엑세스 그룹 동기화` 는 **비운 뒤 다시 채우는** 순서라, 비운 채로 끊기면 표가 빈 채로 남습니다.
> 누른 뒤에는 결과를 확인하고, 이상하면 **4.1 설정 다운로드**로 다시 보내세요.

## 5. 원본 매뉴얼과 대조

> 원본 매뉴얼을 보다가 아래 절에 이르면 이 쪽을 함께 보세요.
> 여기 없는 절은 **원본 그대로**입니다.
> 쪽 번호는 **원본 PDF(172쪽)의 쪽 번호**입니다 — 원본 목차의 번호와 같습니다.

### 원본 §2.1 i. 3) 장치정보가 변경되면 항상 Update 를 실행한다 (p21)

`도구 → 옵션 → 기본환경 → 일반` 의 체크박스입니다. 여기서 **Update 는 4.11.1 의 `업데이트`(ACU → DB 읽어 오기)** 입니다.
원본은 *"변경내용을 자동으로 업데이트"* 라고 적어 **ACU 로 내려보내는 것처럼** 읽히지만, 방향이 반대입니다.

🔴 **이 체크박스는 동작하지 않습니다** — 켜든 끄든 결과가 같습니다(ACAM40 · IDTi 모두).   📄
IDTi 는 `장치 관리` 를 열 때 아직 읽어 오지 않은 ACU · 카드리더가 있으면 업데이트 창이 **항상** 뜹니다.
ACAM40 은 이 창이 아예 뜨지 않습니다 → **4.11.1 의 알아두기**

### 원본 §2.4 데이터 통신 — 자동 동기화 (p25~26)

- 🟡 **i. 사용자 자동 동기화** — 사용자를 고치면 자동으로 보냅니다. ⬜ ACAM40 확인 전입니다.
- 🔴 **ii. 휴일 자동 동기화** — ACAM40은 해마다 다시 보내야 해서 특히 중요합니다 → **4.7 의 팁**. ⬜ 확인 전입니다.

### 원본 §2.6 장치 → 근접인식 (p27~29)

🟡 ACAM40 리더의 카드 포맷은 **카드리더 속성의 `ACAM-40` 탭**에서 정합니다 → **4.4**

### 원본 §3.1 컨트롤러 관리 → iv. 컨트롤러 등록 (p34~36)

- **모델** — ACAM40을 선택 합니다. **주소**는 장비의 (로터리 스위치 값 +1) 주소와 같아야 합니다 → **4.1**
- 🟡 **Step 6 자동 업데이트** — 등록 직후에는 **4.1 설정 다운로드**를 한 번 하세요. 그래야 ACU 가 완성됩니다.

### 원본 §3.2 운영모드 제어 (p38~43)

🔴 **ACAM40에는 운영모드가 없습니다.** 이 절은 건너뛰세요 → **3.2**

### 원본 §4.4 사용자 관리 (p70~101)

- **기한**(발급일 · 만료일)과 **인증 유효기간**의 차이 → **4.8**
  원본 iv. **사용자 만료**(만료일을 어제로 고치고 보내기)는 ACAM40 에서도 그대로 됩니다.
- **보내기 · 권한 회수 · 삭제**, **일괄적용은 DB 만 바꾼다** → **4.9**

### 원본 §6 맵 (p130~148)

🟢 됩니다. 맵에서 여는 **입력센서 속성 · 출력릴레이 속성 창은 장치 설정에서 여는 것과 같은 창**이라
4.2 · 4.3 이 그대로 적용됩니다.

### 원본 §7 이벤트 (p149~158)

🔴 **이벤트 재취득 · 이벤트 초기화**(p157~158)는 ACAM40 에서 받지 않습니다. ✅
어떤 이벤트가 올라오는지는 **6장**.

🟢 **보고서 기능 자체는 ACU 와 무관합니다.** 다만 **지원 하지 않는 보고서**가 있습니다.

### IDTi 에는 있는데 ACAM40 에는 없는 줄

**없다고 고장이 아닙니다.**

```
인증 › 승인 거부 › 출입구역
시스템 › 관리자 모드 접속 / 실패 / 종료 · 팩토리 초기화 성공
시스템 › 운영 모드 변경 · 날짜 & 시간 변경됨 · 릴레이 활성화 성공
시스템 › EX 센서 › 모션 알람 발생 / 복구
시스템 › 장치 › 전원 구동 / 전원 구동 실패 · 펌웨어 업데이트 · 이벤트 인덱스 변경됨
통신 › 상태 › 연결 끊김
데이터(사용자 · 카드 · 입력 · 출력 · 리더 · 타임존 · 엑세스 그룹 …) 계열 전부
```

> **알아두기** — **화재 복구는 `화재 알람 복구` 가 아니라 `센서 알람 복구`(`18010112`)로 올라옵니다.** IDTi 는 화재 복구 줄이 따로 있습니다.
> 장치관리자에 **화재 시 강제개방 정책**이 걸려 있으면, ACAM40 의 화재 알람에도 지정한 컨트롤러의 문이 강제개방됩니다 —
> 화재가 풀려도 저절로 돌아가지 않으니 `출입문 강제개방 모드` 를 **`일반`** 으로 되돌리세요(4.10).
> **`통신 › 상태 › 연결 끊김` 이 없습니다** — ACAM40 이 끊겨도 이 줄로는 안 보입니다.
> 연결 상태는 **장치 정보의 통신 정보**를 보세요(원본 §1.5 v. 기타 정보, p17~19).
> **설정을 바꿔도 `데이터` 계열 이벤트가 안 남습니다** — 기록이 필요하면 따로 적어 두세요.

> 📄 **근거** — 위 16 가지는 **장치관리자가 ACAM40 이벤트를 Platinum 코드로 옮기는 표**
> 에서, 나올 수 없는 셋을 뺀 것입니다 —
> `출입문 강제개방 모드` · `출입문 일반 모드` 는 ACU 의 문 운영이 「항시 개방 · 항시 닫힘」일 때 카드를 대면 뜨는데,
> Platinum 에는 그 운영을 거는 메뉴가 없습니다. **`출입문 강제개방 모드` 를 바꿔도 이 줄은 뜨지 않습니다**(4.10, 2026-10-01 실장비).
> `케이스 커버 복구됨` 은 ACU 펌웨어에 리더 케이스를 감지하는 코드가 없어 올라오지 않습니다(펌웨어 소스 확인, 2026-10-02). `✅` 표시와 위 목록은 그동안의 이벤트 기록을 ACU별로 세어
> ACAM 셋(ACAM01 · 02 · 03)과 IDTi 넷(ACU03 · 04 · 05 · ncu01)을 대조한 것입니다.

    if (m && depth >= 2) {
      var cls = m[1] === '✅' ? 'ok' : m[1] === '📄' ? 'doc' : 'todo';
      chip = '<span class="chip ' + cls + '">' + m[1] + (m[2] ? ' ' + m[2] : '') + '</span>';
      text = text.replace(CHIP, '');
    }
    var id = 'h' + (++slug);
    if (depth === 2 || depth === 3) toc.push({ id: id, d: depth, t: text.replace(/<[^>]+>/g, '') });
    return '<h' + depth + ' id="' + id + '">' + text + chip + '</h' + depth + '>';
  };
  renderer.table = function(header, body){
    return '<div class="tw"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>';
  };

  marked.setOptions({ renderer: renderer, gfm: true, breaks: true });
  document.getElementById('doc').innerHTML = marked.parse(src);

  // 머리말 블록(작성일 줄)은 본문에서 떼어 meta 로 올린다.
  var first = document.querySelector('#doc > blockquote');
  if (first && /작성|갱신/.test(first.textContent)) {
    document.getElementById('meta').textContent =
      first.textContent.replace(/\s+/g, ' ').replace(/^.*?(작성)/, '$1').trim();
    first.remove();
  }

  var list = document.getElementById('toclist');
  toc.forEach(function(x){
    var a = document.createElement('a');
    a.href = '#' + x.id; a.textContent = x.t; a.className = x.d === 3 ? 'l3' : '';
    list.appendChild(a);
  });

  var links = Array.prototype.slice.call(list.querySelectorAll('a'));
  var heads = toc.map(function(x){ return document.getElementById(x.id); });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (!e.isIntersecting) return;
        var i = heads.indexOf(e.target);
        links.forEach(function(a, j){ a.classList.toggle('on', j === i); });
      });
    }, { rootMargin: '0px 0px -75% 0px' });
    heads.forEach(function(h){ if (h) io.observe(h); });
  }

  var btn = document.getElementById('themebtn');
  btn.addEventListener('click', function(){
    var r = document.documentElement;
    var dark = r.getAttribute('data-theme') === 'dark' ||
      (!r.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
})();
</script>

</body></html>
